# Mobile CI: lint, format check, unit tests, and a web export on every PR that
# touches mobile/. The web export is not optional — the deployed web build is
# the primary demo surface, so a PR that breaks it must not merge.
name: Mobile CI

on:
  pull_request:
    branches: [main]
    paths: ["mobile/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx prettier --check .

      - name: Lint
        run: npx expo lint

      - name: Unit tests
        run: npm test

      - name: Web export
        run: npx expo export -p web
